name: Customer360 CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: customer360-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-gate:
    name: Backend - Lint, Build, Test and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: customer360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customer360_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customer360_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/customer360_test
      JWT_SECRET: customer360_ci_test_secret_at_least_32_characters
      JWT_EXPIRES_IN: 15m
      CORS_ORIGINS: http://localhost:5173
      JSON_BODY_LIMIT: 100kb
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_MAX: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Build backend for production
        run: npm run build:production

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn
          retention-days: 7

  frontend-quality-gate:
    name: Frontend - Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    env:
      VITE_API_BASE_URL: https://api.example.com/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build